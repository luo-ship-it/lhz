<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘宝风格电商首页</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <span>亲，请登录</span>
      <span>免费注册</span>
      <span>我的订单</span>
      <span>购物车</span>
    </div>
  </header>

  <div class="container search-area">
    <div class="logo">淘宝风格</div>
    <form class="search-box" action="#" method="get">
      <label class="sr-only" for="site-search">搜索商品或店铺</label>
      <input id="site-search" name="q" type="text" placeholder="搜索商品 / 店铺" aria-label="搜索商品或店铺">
      <button type="submit">搜索</button>
    </form>
  </div>

  <nav class="nav">
    <div class="container nav-inner">
      <a href="#">女装</a>
      <a href="#">男装</a>
      <a href="#">数码</a>
      <a href="#">家电</a>
      <a href="#">食品</a>
      <a href="#">美妆</a>
      <a href="#">母婴</a>
      <a href="#">图书</a>
    </div>
  </nav>

  <main class="container main">
    <aside class="category">
      <h2>全部分类</h2>
      <ul>
        <li>服饰鞋包</li>
        <li>手机数码</li>
        <li>家用电器</li>
        <li>食品生鲜</li>
        <li>家居家装</li>
        <li>美妆个护</li>
      </ul>
    </aside>

    <section class="hero">
      <div class="banner">
        <h1>限时大促</h1>
        <p>精选好货，每日低价</p>
      </div>
      <div class="product-grid">
        <article class="card">
          <div class="thumb">商品图</div>
          <h3>无线蓝牙耳机</h3>
          <p class="price">¥99.00</p>
        </article>
        <article class="card">
          <div class="thumb">商品图</div>
          <h3>轻薄运动外套</h3>
          <p class="price">¥129.00</p>
        </article>
        <article class="card">
          <div class="thumb">商品图</div>
          <h3>便携榨汁杯</h3>
          <p class="price">¥59.00</p>
        </article>
        <article class="card">
          <div class="thumb">商品图</div>
          <h3>家用空气炸锅</h3>
          <p class="price">¥259.00</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
