<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘宝风格电商首页</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#">亲，请登录</a>
      <a href="#">免费注册</a>
      <a href="#">我的订单</a>
      <a href="#">购物车</a>
    </div>
  </header>

  <div class="container search-area">
    <div class="logo">淘宝风格</div>
    <form class="search-box" action="#" method="get">
      <label class="sr-only" for="site-search">搜索商品或店铺</label>
      <input id="site-search" name="q" type="text" placeholder="搜索商品 / 店铺">
      <button type="submit">搜索</button>
    </form>
  </div>

  <nav class="nav">
    <div class="container nav-inner">
      <a href="#">女装</a>
      <a href="#">男装</a>
      <a href="#">数码</a>
      <a href="#">家电</a>
      <a href="#">食品</a>
      <a href="#">美妆</a>
      <a href="#">母婴</a>
      <a href="#">图书</a>
    </div>
  </nav>

  <main class="container main">
    <aside class="category">
      <h2>全部分类</h2>
      <ul>
        <li><a href="#">服饰鞋包</a></li>
        <li><a href="#">手机数码</a></li>
        <li><a href="#">家用电器</a></li>
        <li><a href="#">食品生鲜</a></li>
        <li><a href="#">家居家装</a></li>
        <li><a href="#">美妆个护</a></li>
      </ul>
    </aside>

    <section class="hero">
      <div class="banner">
        <h1>限时大促</h1>
        <p>精选好货，每日低价</p>
      </div>
      <div class="product-grid">
        <article class="card">
          <a class="card-link" href="#">
            <div class="thumb" role="img" aria-label="无线蓝牙耳机商品图">商品图</div>
          </a>
          <h3><a class="card-link" href="#">无线蓝牙耳机</a></h3>
          <p class="price">¥99.00</p>
        </article>
        <article class="card">
          <a class="card-link" href="#">
            <div class="thumb" role="img" aria-label="轻薄运动外套商品图">商品图</div>
          </a>
          <h3><a class="card-link" href="#">轻薄运动外套</a></h3>
          <p class="price">¥129.00</p>
        </article>
        <article class="card">
          <a class="card-link" href="#">
            <div class="thumb" role="img" aria-label="便携榨汁杯商品图">商品图</div>
          </a>
          <h3><a class="card-link" href="#">便携榨汁杯</a></h3>
          <p class="price">¥59.00</p>
        </article>
        <article class="card">
          <a class="card-link" href="#">
            <div class="thumb" role="img" aria-label="家用空气炸锅商品图">商品图</div>
          </a>
          <h3><a class="card-link" href="#">家用空气炸锅</a></h3>
          <p class="price">¥259.00</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
